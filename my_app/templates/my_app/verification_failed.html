{% extends 'my_app/base.html' %}

{% block main-content %}
<div class="container-fluid m-auto first-sec" style="height: 100vh; ">
<div class="row h-100 my-auto">
    <div class="col-xs-10 col-sm-10 col-md-6 col-lg-6 m-auto my-auto">
        <h2 class="gothic-bold large-text text-center white" >
            VERIFICATION FAILED

        <div class="m-auto text-center">

            <a href="{% url 'request-new-link-from-email' %}"  class="submit-btn text-capitalize center text-center m-auto" type="submit">Resend Link</a>
        </div>

    </div>

</div>

</div>

{% endblock main-content %}
